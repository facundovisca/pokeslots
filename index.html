<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon 9 Master Balls of Fire</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="slot-machine">
    
    <!-- 1. Capa de Rodillos giratorios (Atrás del marco) -->
    <div class="reels-layer">
      <div class="reel" id="reel-0"></div>
      <div class="reel" id="reel-1"></div>
      <div class="reel" id="reel-2"></div>
      <div class="reel" id="reel-3"></div>
      <div class="reel" id="reel-4"></div>

      <!-- Lienzo SVG transparente para dibujar las 20 líneas de pago -->
      <svg class="paylines-svg" id="paylines-svg"></svg>
    </div>

    <!-- 2. Marco con transparencias caladas (Capa intermedia) -->
    <img src="assets/images/frame.png" class="frame-overlay" alt="Marco del Tragamonedas" />

    <!-- 3. Escalera lateral con íconos Master Ball (Capa frontal sobre los casilleros) -->
    <ul class="ladder-layer">
      <li data-count="9">
        <div class="rung-badge">
          <img src="assets/symbols/masterball.png" class="ladder-icon" alt="Master Ball" />
          <span class="badge">9</span>
        </div>
        <span class="val">2,000.00</span>
      </li>
      <li data-count="8">
        <div class="rung-badge">
          <img src="assets/symbols/masterball.png" class="ladder-icon" alt="Master Ball" />
          <span class="badge">8</span>
        </div>
        <span class="val">500.00</span>
      </li>
      <li data-count="7">
        <div class="rung-badge">
          <img src="assets/symbols/masterball.png" class="ladder-icon" alt="Master Ball" />
          <span class="badge">7</span>
        </div>
        <span class="val">100.00</span>
      </li>
      <li data-count="6">
        <div class="rung-badge">
          <img src="assets/symbols/masterball.png" class="ladder-icon" alt="Master Ball" />
          <span class="badge">6</span>
        </div>
        <span class="val">40.00</span>
      </li>
      <li data-count="5">
        <div class="rung-badge">
          <img src="assets/symbols/masterball.png" class="ladder-icon" alt="Master Ball" />
          <span class="badge">5</span>
        </div>
        <span class="val">15.00</span>
      </li>
      <li data-count="4">
        <div class="rung-badge">
          <img src="assets/symbols/masterball.png" class="ladder-icon" alt="Master Ball" />
          <span class="badge">4</span>
        </div>
        <span class="val">5.00</span>
      </li>
      <li data-count="3">
        <div class="rung-badge">
          <img src="assets/symbols/masterball.png" class="ladder-icon" alt="Master Ball" />
          <span class="badge">3</span>
        </div>
        <span class="val">1.00</span>
      </li>
    </ul>

    <!-- 4. Controles y marcadores inferiores -->
    <!-- Visor izquierdo: Créditos y Apuesta -->
    <div class="ui-slot bottom-left-display">
      <div class="stat-unit">
        <span class="lbl">CRÉDITOS</span>
        <span id="credits" class="num">2000.00</span>
      </div>
      <div class="stat-unit bet-unit">
        <button id="btn-minus" class="step-btn">-</button>
        <div class="bet-info">
          <span class="lbl">APUESTA</span>
          <span id="bet-amount" class="num">1.00</span>
        </div>
        <button id="btn-plus" class="step-btn">+</button>
      </div>
    </div>

    <!-- Botón circular de giro invisible sobre el botón dorado del marco -->
    <button id="spin-btn" class="spin-hotspot" title="Girar"></button>

    <!-- Visor derecho: Ganancia -->
    <div class="ui-slot bottom-right-display">
      <span class="lbl">PREMIO</span>
      <span id="win-display" class="num win-glow">0.00</span>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
